<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Veterinario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-heart-pulse"></i> Sistema de Gestión Veterinaria
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/mascotas">Mascotas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/propietarios">Propietarios</a>
                </li>
            </ul>
        </div>
    </div>
</nav>


<div class="page-header">
    <div class="container">
        <h1 class="mb-0">
            <i class="bi bi-file-earmark-text"></i>
            <span th:text="${mascota.id != null} ? 'Editar Mascota' : 'Nueva Mascota'">Formulario de Mascota</span>
        </h1>
    </div>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/mascotas/guardar}" th:object="${mascota}" method="post">
                        <input type="hidden" th:field="*{id}">


                        <div class="mb-3">
                            <label for="nombre" class="form-label">
                                Nombre de la Mascota <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{nombre}"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                   placeholder="">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">
                                Error en nombre
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="especie" class="form-label">
                                Especie <span class="text-danger">*</span>
                            </label>
                            <select class="form-select"
                                    th:field="*{especie}"
                                    th:classappend="${#fields.hasErrors('especie')} ? 'is-invalid' : ''">
                                <option value="">Selecciona una especie</option>
                                <option value="Perro">Perro</option>
                                <option value="Gato">Gato</option>
                                <option value="Ave">Ave</option>
                                <option value="Conejo">Conejo</option>
                                <option value="Hamster">Hamster</option>
                                <option value="Reptil">Reptil</option>
                                <option value="Otro">Otro</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('especie')}" th:errors="*{especie}">
                                Error en especie
                            </div>
                        </div>


                        <div class="mb-3">
                            <label for="edad" class="form-label">
                                Edad (años) <span class="text-danger">*</span>
                            </label>
                            <input type="number"
                                   class="form-control"
                                   th:field="*{edad}"
                                   th:classappend="${#fields.hasErrors('edad')} ? 'is-invalid' : ''"
                                   min="0"
                                   max="50"
                                   placeholder="">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('edad')}" th:errors="*{edad}">
                                Error en edad
                            </div>
                        </div>


                        <div class="mb-4">
                            <label for="propietario" class="form-label">
                                Propietario <span class="text-danger">*</span>
                            </label>
                            <select class="form-select"
                                    th:field="*{propietario.id}"
                                    required>
                                <option value="">Selecciona un propietario</option>
                                <option th:each="prop : ${propietarios}"
                                        th:value="${prop.id}"
                                        th:text="${prop.nombre + ' - ' + prop.documento}">
                                    Propietario
                                </option>
                            </select>
                            <small class="text-muted">
                                Si el propietario no está en la lista,
                                <a href="/propietarios/nuevo" target="_blank">regístralo aquí</a>
                            </small>
                        </div>


                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="/mascotas" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i> Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-4 mt-5">
    <div class="container">
        <p class="mb-0">&copy; 2025 Sistema de Gestión Veterinaria</p>
        <p class="mb-0">Robertson Mondragon Giron</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
